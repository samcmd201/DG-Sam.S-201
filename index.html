<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="sam" />
    <meta name="color-scheme" content="dark light" />

    <title>Sam's Gallery</title>
    <link rel="stylesheet" href="./css/normal.css" />

    <!-- Voeg jouw eigen domein toe in data-page -->
    <script
      data-page="https://example.com"
      src="./scripts/main.js"
      defer
    ></script>
  </head>
  <body>
    <header>
      <h1>Welkom in mijn gallery</h1>
    </header>

    <main>
      <article>
        <nav>
          <ul>
            <li>
              <button class="poster-1-normaal">
                <picture>
                  <source
                    srcset="./images/vampier-poster-dm.png"
                    media="(prefers-color-scheme: dark)"
                  />
                  <img
                    src="./images/vampier-poster-lm.png"
                    alt="poster 1 waar de mond van een vampier te zien is met op de achtergrond de tekst bite me"
                  />
                </picture>
              </button>
            </li>
            <li>
              <button class="poster2">
                <picture>
                  <source
                    srcset="./images/frenkie-poster-dm.png"
                    media="(prefers-color-scheme: dark)"
                  />
                  <img
                    src="./images/frenkie-poster-lm.png"
                    alt="poster 1 waar de mond van een vampier te zien is met op de achtergrond de tekst bite me"
                  />
                </picture>
              </button>
            </li>
            <li>
              <button class="poster3">
                <picture>
                  <source
                    srcset="./images/fc-poster-dm.png"
                    media="(prefers-color-scheme: dark)"
                  />
                  <img
                    src="./images/fc-poster-lm.png"
                    alt="poster 1 waar de mond van een vampier te zien is met op de achtergrond de tekst bite me"
                  />
                </picture>
              </button>
            </li>
            <li>
              <button class="poster4">
                <picture>
                  <source
                    srcset="./images/mbappe-dm.png"
                    media="(prefers-color-scheme: dark)"
                  />
                  <img
                    src="./images/mbappe-lm.png"
                    alt="poster 1 waar de mond van een vampier te zien is met op de achtergrond de tekst bite me"
                  />
                </picture>
              </button>
            </li>
            <li>
              <button class="poster5">
                <picture>
                  <source
                    srcset="./images/itwelcometoderry-dm.png"
                    media="(prefers-color-scheme: dark)"
                  />
                  <img
                    src="./images/itwelcometoderry-lm.png"
                    alt="poster 1 waar de mond van een vampier te zien is met op de achtergrond de tekst bite me"
                  />
                </picture>
              </button>
            </li>
            <li>
              <button class="poster6">
                <picture>
                  <source
                    srcset="./images/jazz-dm.png"
                    media="(prefers-color-scheme: dark)"
                  />
                  <img
                    src="./images/jazz-lm.png"
                    alt="poster 1 waar de mond van een vampier te zien is met op de achtergrond de tekst bite me"
                  />
                </picture>
              </button>
            </li>
          </ul>
        </nav>
        <p>Klik op een poster om er meer over te lezen</p>
      </article>

      <form>
        <h3>customize de weergave</h3>
        <div class="radio-optie">
          <input
            type="radio"
            id="organisch"
            name="fav_weergave"
            value="Organisch"
            checked
          />
          <label for="organisch">Organisch</label>
        </div>
        <div class="radio-optie">
          <input
            type="radio"
            id="carousel"
            name="fav_weergave"
            value="Carousel"
          />
          <label for="carousel">Carousel</label>
        </div>
      </form>
    </main>

    <footer></footer>
  </body>
</html>
