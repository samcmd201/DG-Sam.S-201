# Onderwerp


Mijn interesse is het maken van een toffe opslagplaats voor mijn favoriete designs, met name posters die ik gemaakt heb in photoshop. 
Ik heb vooral posters gemaakt van films en topsporters die ik interessant vind. Het leukt me leuk om dit op een orginele manier te displayen 
en misschien zelfs te animeren en daardoor mezelf uit te dagen omdat ik nog niet goed ben in coderen. Hieronder zie je mijn huidige carousel gemaakt in figma met daarin mijn posters.
