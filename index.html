<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="sam" />
    <meta name="color-scheme" content="dark light" />

    <title>Sams Gallery</title>
    <link rel="stylesheet" href="./css/normal.css" />

    <!-- Voeg jouw eigen domein toe in data-page -->
    <script
      data-page="https://example.com"
      src="./scripts/main.js"
      defer
    ></script>
  </head>
  <body>
    <header>
      <h1>Welkom in mijn gallery</h1>
    </header>

    <main>
      <article>
        <nav>
          <ul>
            <li>
              <button>
                <img src="./images/vampier.png" alt="poster 1" />
              </button>
            </li>
            <li>
              <button>
                <img src="./images/frenkie poster.png" alt="poster 2" />
              </button>
            </li>
            <li>
              <button>
                <img src="./images/fc poster.png" alt="poster 3" />
              </button>
            </li>
            <li>
              <button>
                <img src="./images/mbappebloempje.png" alt="poster 4" />
              </button>
            </li>
            <li>
              <button>
                <img src="./images/it welcome to derry.png" alt="poster 5" />
              </button>
            </li>
            <li>
              <button><img src="./images/jazz.png" alt="poster 6" /></button>
            </li>
          </ul>
        </nav>
        <p>Klik op een poster om er meer over te lezen</p>
      </article>

      <form>
        <h3>customize de weergave</h3>
        <input
          type="radio"
          id="organisch"
          name="fav_weergave"
          value="Organisch"
          checked
        />
        <label for="organisch">Organisch</label>
        <input
          type="radio"
          id="carousel"
          name="fav_weergave"
          value="Carousel"
        />
        <label for="carousel">Carousel</label>
      </form>
    </main>

    <footer></footer>
  </body>
</html>
